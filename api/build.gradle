apply plugin: 'org.springframework.boot'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'com.mysql:mysql-connector-j:8.0.33'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    
    // JWT 관련 라이브러리
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    
    // 패스워드 암호화
    implementation 'org.springframework.security:spring-security-crypto'
    
    // 다른 모듈 의존성
    implementation project(':core')
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'it.ozimov:embedded-redis:0.7.3'  // 테스트용 Embedded Redis
    runtimeOnly 'com.h2database:h2'  // 런타임에 H2 사용 가능
}

// API 서버 실행 가능한 JAR
bootJar {
    mainClass.set("com.project.api.ApiApplication")
    enabled = true
}

// 다른 모듈에서 사용할 수 있는 일반 JAR (plain JAR)
jar {
    enabled = true
    archiveClassifier = 'plain'  // bootJar와 구분하기 위해 classifier 추가
}