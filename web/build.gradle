apply plugin: 'org.springframework.boot'

dependencies {
    // Spring Boot 웹 의존성
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'  // Thymeleaf Layout Dialect 추가
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'  // JPA 의존성 추가
    implementation 'com.mysql:mysql-connector-j:8.0.33'  // MySQL 드라이버 추가
    
    // 다른 모듈 의존성
    implementation project(':core')
    implementation(project(':api')) {
        // API 모듈의 plain JAR를 사용 (bootJar가 아닌)
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
    }
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    runtimeOnly 'com.h2database:h2'  // 런타임에 H2 사용 가능
}

// 웹 서버 실행 가능한 JAR
bootJar {
    mainClass.set("com.project.web.WebApplication")
    enabled = true
}

jar {
    enabled = true
}
