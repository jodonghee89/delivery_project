<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: '배달 서비스 관리'">배달 서비스 관리</title>
    
    <!-- Pretendard 폰트 -->
    <link rel="stylesheet" as="style" crossorigin 
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    
    <!-- Bootstrap CSS (최소한만 사용) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Lucide Icons (modern alternative to Font Awesome) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <!-- 🎨 Modern Navigation -->
    <nav class="navbar">
        <div class="container-fluid">
            <div class="d-flex align-items-center justify-content-between w-100">
                <!-- Logo & Brand -->
                <a class="navbar-brand" href="/">
                    <i data-lucide="truck" style="width: 24px; height: 24px;"></i>
                    <span>배달 서비스</span>
                </a>
                
                <!-- Navigation Links -->
                <div class="d-flex align-items-center gap-3">
                    <a class="nav-link" href="/" th:classappend="${#httpServletRequest.requestURI == '/'} ? 'active' : ''">
                        <i data-lucide="layout-dashboard" style="width: 16px; height: 16px;"></i>
                        <span>대시보드</span>
                    </a>
                    <a class="nav-link" href="/customers" th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/customers')} ? 'active' : ''">
                        <i data-lucide="users" style="width: 16px; height: 16px;"></i>
                        <span>고객 관리</span>
                    </a>
                    <a class="nav-link" href="/orders" th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/orders')} ? 'active' : ''">
                        <i data-lucide="shopping-cart" style="width: 16px; height: 16px;"></i>
                        <span>주문 관리</span>
                    </a>
                    
                    <!-- User Menu -->
                    <div class="d-flex align-items-center gap-2 ms-4">
                        <div class="avatar avatar-sm">
                            <i data-lucide="user" style="width: 14px; height: 14px;"></i>
                        </div>
                        <span class="text-muted" style="font-size: 0.875rem;">관리자</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 🚀 Main Content -->
    <main class="container-fluid py-4">
        <!-- Page Header (if title exists) -->
        <div th:if="${pageTitle}" class="page-header">
            <h1 th:text="${pageTitle}">페이지 제목</h1>
            <p th:if="${pageDescription}" th:text="${pageDescription}">페이지 설명</p>
        </div>

        <!-- Alert Messages -->
        <div th:if="${message}" class="alert alert-success fade-in" role="alert">
            <div class="d-flex align-items-center gap-2">
                <i data-lucide="check-circle" style="width: 16px; height: 16px;"></i>
                <span th:text="${message}"></span>
            </div>
        </div>
        
        <div th:if="${error}" class="alert alert-danger fade-in" role="alert">
            <div class="d-flex align-items-center gap-2">
                <i data-lucide="alert-circle" style="width: 16px; height: 16px;"></i>
                <span th:text="${error}"></span>
            </div>
        </div>

        <!-- Page Content -->
        <div th:replace="${content}"></div>
    </main>

    <!-- 📱 Footer -->
    <footer style="margin-top: 4rem; padding: 2rem 0; border-top: 1px solid var(--color-border); text-align: center;">
        <div class="container-fluid">
            <p class="text-muted" style="margin: 0; font-size: 0.875rem;">
                © 2024 배달 서비스 관리 시스템. 현대적이고 깔끔한 관리 도구.
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS (minimal) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Initialize Lucide Icons -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();
        });
    </script>
    
    <!-- Custom JS -->
    <script th:src="@{/js/app.js}" th:if="${#files.exists('/static/js/app.js')}"></script>
</body>
</html>
